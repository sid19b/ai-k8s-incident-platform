apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-service
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/sid19b/ai-k8s-incident-platform.git
    targetRevision: main
    path: gitops/apps/ai-service/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true